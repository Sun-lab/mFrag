[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mfrag"
version = "0.1.0"
description = "Methylation-informed cfDNA fragmentomics for cancer early detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.2",
  "joblib>=1.2",
  "matplotlib>=3.6",
  "torch>=2.0",
  "pyfaidx>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["code"]
